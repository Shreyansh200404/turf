<style>
    :root {
        --owner-sidebar-width: 240px;
        --owner-sidebar-collapsed-width: 70px;
    }

    /* =====================================================
       PAGE SPACE FOR SIDEBAR
    ===================================================== */

    body {
        padding-left: 240px !important;
        margin: 0 !important;
        overflow-x: hidden;
        transition: padding-left 0.3s ease;
    }

    body.owner-sidebar-collapsed {
        padding-left: 70px !important;
    }


    /* =====================================================
       TOGGLE BUTTON
    ===================================================== */

    #owner-sidebar-toggle {
        position: fixed !important;
        top: 10px !important;
        left: 10px !important;

        width: 38px;
        height: 38px;

        display: flex !important;
        align-items: center;
        justify-content: center;

        background: #ffffff;
        border: 1px solid #dee2e6;
        border-radius: 6px;

        color: #212529;

        cursor: pointer;

        z-index: 99999 !important;
    }

    #owner-sidebar-toggle:hover {
        background: #f1f3f5;
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    #owner-sidebar {
        position: fixed !important;

        top: 0 !important;
        left: 0 !important;

        width: 240px !important;
        height: 100vh !important;

        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;

        background: #ffffff !important;

        border-right: 1px solid #dee2e6;

        z-index: 99998 !important;

        overflow-x: hidden;
        overflow-y: auto;

        box-sizing: border-box;

        transition: width 0.3s ease;
    }


    /* =====================================================
       SIDEBAR CONTENT
    ===================================================== */

    #owner-sidebar .owner-sidebar-sticky {
        width: 100%;
        padding-top: 60px;
        padding-bottom: 20px;
    }


    /* =====================================================
       BRAND
    ===================================================== */

    #owner-sidebar .owner-sidebar-brand {
        display: block !important;

        margin: 0 !important;

        padding: 15px 18px !important;

        color: #212529 !important;

        font-size: 1.35rem !important;
        font-weight: 600 !important;

        white-space: nowrap;
    }

    #owner-sidebar .owner-sidebar-brand i {
        color: #0d6efd;
    }


    /* =====================================================
       MENU
    ===================================================== */

    #owner-sidebar ul.nav {
        display: flex !important;

        flex-direction: column;

        width: 100%;

        padding: 0;
        margin: 0;
    }

    #owner-sidebar .nav-item {
        display: block !important;
        width: 100%;
    }


    #owner-sidebar .nav-link {
        display: flex !important;

        align-items: center;

        width: auto;

        margin: 3px 10px !important;

        padding: 11px 10px !important;

        border-radius: 6px;

        color: #0d6efd !important;

        background: transparent;

        text-decoration: none !important;

        white-space: nowrap;

        font-size: 1rem;
    }


    #owner-sidebar .nav-link:hover {
        background: #f1f3f5 !important;
        color: #0d6efd !important;
    }


    #owner-sidebar .nav-link.active {
        background: #0d6efd !important;
        color: #ffffff !important;
    }


    #owner-sidebar .nav-link i {
        width: 25px;
        min-width: 25px;

        text-align: center;
    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    #owner-sidebar .owner-sidebar-logout {
        margin-top: 10px;
    }


    /* =====================================================
       COLLAPSED
    ===================================================== */

    body.owner-sidebar-collapsed #owner-sidebar {
        width: 70px !important;
    }


    body.owner-sidebar-collapsed
    #owner-sidebar .owner-sidebar-brand {
        padding-left: 0 !important;
        padding-right: 0 !important;

        text-align: center;

        font-size: 0 !important;
    }


    body.owner-sidebar-collapsed
    #owner-sidebar .owner-sidebar-brand i {
        margin-right: 0 !important;

        font-size: 1.35rem !important;
    }


    body.owner-sidebar-collapsed
    #owner-sidebar .nav-link {
        justify-content: center;

        padding-left: 0 !important;
        padding-right: 0 !important;
    }


    body.owner-sidebar-collapsed
    #owner-sidebar .nav-link span {
        display: none !important;
    }


    body.owner-sidebar-collapsed
    #owner-sidebar .nav-link i {
        margin-right: 0 !important;
    }


    /* =====================================================
       MOBILE BACKDROP
    ===================================================== */

    #owner-sidebar-backdrop {
        display: none;

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.4);

        z-index: 99997;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 768px) {

        body {
            padding-left: 0 !important;
        }


        #owner-sidebar {
            width: 240px !important;

            transform: translateX(-100%) !important;

            transition: transform 0.3s ease;
        }


        body.owner-sidebar-open #owner-sidebar {
            transform: translateX(0) !important;
        }


        body.owner-sidebar-open
        #owner-sidebar-backdrop {
            display: block;
        }


        body.owner-sidebar-collapsed
        #owner-sidebar {
            width: 240px !important;
        }


        body.owner-sidebar-collapsed
        #owner-sidebar .owner-sidebar-brand {
            padding-left: 18px !important;

            text-align: left;

            font-size: 1.35rem !important;
        }


        body.owner-sidebar-collapsed
        #owner-sidebar .owner-sidebar-brand i {
            font-size: inherit !important;
        }


        body.owner-sidebar-collapsed
        #owner-sidebar .nav-link {
            justify-content: flex-start;

            padding-left: 10px !important;
            padding-right: 10px !important;
        }


        body.owner-sidebar-collapsed
        #owner-sidebar .nav-link span {
            display: inline !important;
        }


        body.owner-sidebar-collapsed
        #owner-sidebar .nav-link i {
            margin-right: 0.5rem !important;
        }
    }
</style>


<!-- =====================================================
     TOGGLE BUTTON
===================================================== -->

            <li class="nav-item">

            </li>


            <!-- Payments -->

            <li class="nav-item">

                <a

            <!-- Analytics -->

            <!-- Settings -->

                <a
                    class="nav-link {% if request.resolver_match.url_name == 'owner_settings' %}active{% endif %}"
                    href="{% url 'owner_settings' %}"
                    title="Settings"
                >

                    <i class="fas fa-cog me-2"></i>

                    <span>Settings</span>

                </a>

            </li> -->


            <!-- Logout -->

            <li class="nav-item owner-sidebar-logout">

                <a
                    class="nav-link"
                    href="{% url 'logout' %}"
                    title="Logout"
                >

                    <i class="fas fa-sign-out-alt me-2"></i>

                    <span>Logout</span>

                </a>

            </li>

        </ul>

    </div>

</nav>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>
(function () {

    const toggle =
        document.getElementById('owner-sidebar-toggle');

    const sidebar =
        document.getElementById('owner-sidebar');

    const backdrop =
        document.getElementById('owner-sidebar-backdrop');

    const mobile =
        window.matchMedia('(max-width: 768px)');


    function setSidebar(open) {

        if (mobile.matches) {

            document.body.classList.toggle(
                'owner-sidebar-open',
                open
            );

            document.body.classList.remove(
                'owner-sidebar-collapsed'
            );

        } else {

            document.body.classList.remove(
                'owner-sidebar-open'
            );

            document.body.classList.toggle(
                'owner-sidebar-collapsed',
                !open
            );
        }


        toggle.setAttribute(
            'aria-expanded',
            String(open)
        );


        const text = mobile.matches
            ? (open ? 'Close' : 'Open')
            : (open ? 'Collapse' : 'Expand');


        toggle.setAttribute(
            'aria-label',
            text + ' navigation'
        );

        toggle.setAttribute(
            'title',
            text + ' navigation'
        );
    }


    toggle.addEventListener(
        'click',
        function () {

            if (mobile.matches) {

                const open =
                    document.body.classList.contains(
                        'owner-sidebar-open'
                    );

                setSidebar(!open);

            } else {

                const collapsed =
                    document.body.classList.contains(
                        'owner-sidebar-collapsed'
                    );

                setSidebar(collapsed);

            }

        }
    );


    backdrop.addEventListener(
        'click',
        function () {
            setSidebar(false);
        }
    );


    document.addEventListener(
        'keydown',
        function (event) {

            if (
                event.key === 'Escape' &&
                document.body.classList.contains(
                    'owner-sidebar-open'
                )
            ) {
                setSidebar(false);
            }

        }
    );


    mobile.addEventListener(
        'change',
        function (event) {
            setSidebar(!event.matches);
        }
    );


    /* Initial state */
    setSidebar(true);

})();
</script>
