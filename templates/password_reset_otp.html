<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Reset Code | SK Sports Park</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #f8f9fa; }
    .card { width: min(90%, 440px); padding: 2rem; border: 0; border-radius: 12px; box-shadow: 0 4px 18px #00000012; }
    .btn-primary { background: #00b665; border-color: #00b665; }
    .btn-primary:hover { background: #009955; border-color: #009955; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="h3 text-center mb-3">Check your email</h1>
    <p class="text-muted">If an account exists for that address, we’ve sent a 6-digit code. It expires in 10 minutes.</p>
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="form-label" for="id_otp">One-time code</label>
      <input
        class="form-control"
        type="text"
        name="otp"
        id="id_otp"
        inputmode="numeric"
        pattern="[0-9]{6}"
        autocomplete="one-time-code"
        maxlength="6"
        required
        autofocus
      >
      <button type="submit" class="btn btn-primary w-100 mt-4">Verify code</button>
    </form>
    <p class="text-center mb-0 mt-3"><a href="{% url 'password_reset' %}">Request another code</a></p>
  </main>
</body>
</html>
