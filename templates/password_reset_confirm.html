<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password | SK Sports Park</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #f8f9fa; }
    .card { width: min(90%, 480px); padding: 2rem; border: 0; border-radius: 12px; box-shadow: 0 4px 18px #00000012; }
    .btn-primary { background: #00b665; border-color: #00b665; }
    .btn-primary:hover { background: #009955; border-color: #009955; }
    .helptext, ul { color: #6c757d; font-size: .875rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="h3 text-center mb-4">Set a new password</h1>
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
          {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary w-100 mt-2">Change password</button>
    </form>
  </main>
</body>
</html>
